<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dundee Recovery Map</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
  <header>
  <div class="header-text">
    <h1>Dundee Recovery Map</h1>
    <p></p>
  </div>
  <!--<div class="today-badge" id="today-label">Loading...</div>-->
  </header>

    <main>

      <div class="controls">

      <!-- Row 1: Day buttons, categories, and search bar -->
      <div class="controls-row">
        <div class="day-btns" id="day-btns"></div>
        <div class="divider"></div>
        <div class="cat-btns" id="cat-btns"></div>
        <div class="search-box">
          <input type="text" id="search" placeholder="Search services..."/>
        </div>
      </div>

      <!-- Row 2: Other grouping filters-->
      <details class="filter-panel">
        <summary class="filter-panel-summary">⚙ Filters</summary>
        <div class="controls-row filter-row">
            <span class="filter-label">Cost:</span>
            <div class="filter-btns" id="cost-btns"></div>
            <div class="divider"></div>
            <span class="filter-label">Target group:</span>
            <div class="filter-btns" id="grp-btns"></div>
            <div class="divider"></div>
            <span class="filter-label">Access:</span>
            <div class="filter-btns" id="access-btns"></div>
        </div>
      </details>
      <div class="controls-row filter-action-row">
      <button class="filter-action-btn show-all" id="show-all-filters">
        ◉ Show all
      </button>
      <button class="filter-action-btn clear-all" id="clear-filters">
        ○ Clear all
      </button>
    </div>


    </div>

    <div class="stats-bar">
      <span>Showing <strong id="count">0</strong> services</span>
      <span id="open-count-label"></span>
      <span style="margin-left:auto;color:#888">
         · Click a pin for details
      </span>
    </div>

  <!--MAP | SIDEBAR LAYOUT-->
  <div class="map-and-sidebar">

    <!-- Map area --> 
    <div class="map-column">
    <div id="map"></div>

    <div class="legend" id="legend">
        <button class="legend-toggle" aria-expanded="false">
        Service types
        </button>
        <div class="legend-content"></div>
    </div>
    </div>


    <!-- Sidebar: UK/Scotland/city-wide services with no pin location.-->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Remote and National Services</span>
        <span class="sidebar-subtitle">
          Phone lines, online support, and services without a fixed location.
          (<strong id="sidebar-count">0</strong>)
        </span>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <p class="sidebar-empty">Loading...</p>
      </div>
    </aside>

  </div>
    </main>
  <footer>
  <!--© 2026 Shannon Martin. All rights reserved. Created as part of a prototype services-mapping application.-->
  </footer>
  </body>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="recoveryMap.js"></script>
</html>
